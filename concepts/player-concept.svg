<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <!-- Body: off-white with a soft top highlight and darker base (a little depth, still flat-ish). -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dbe8"/>
    </linearGradient>
    <linearGradient id="bodyDash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#8fd3ff"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#262636"/>
      <stop offset="1" stop-color="#0b0b10"/>
    </radialGradient>
    <!-- A reusable hand and foot. -->
    <g id="hand"><circle r="9" fill="url(#body)" stroke="#1a1a26" stroke-width="3"/></g>
    <g id="foot"><path d="M-7 -10 h8 v10 h12 v6 h-20 z" fill="#2a2a3a" stroke="#1a1a26" stroke-width="2" stroke-linejoin="round"/></g>
  </defs>

  <rect width="1000" height="360" fill="url(#pool)"/>
  <rect x="0" y="262" width="1000" height="98" fill="#2b2b3a"/>
  <rect x="0" y="262" width="1000" height="4" fill="#3a3a4d"/>

  <!-- 1. Idle -->
  <g transform="translate(110 262)">
    <use href="#foot" x="-14" y="0"/>
    <use href="#foot" x="10" y="0"/>
    <rect x="-30" y="-74" width="60" height="60" rx="8" fill="url(#body)" stroke="#1a1a26" stroke-width="3"/>
    <ellipse cx="-11" cy="-52" rx="5" ry="7" fill="#1a1a26"/>
    <ellipse cx="11" cy="-52" rx="5" ry="7" fill="#1a1a26"/>
    <circle cx="-9.5" cy="-55" r="1.6" fill="#fff"/>
    <circle cx="12.5" cy="-55" r="1.6" fill="#fff"/>
    <path d="M-9 -34 q9 9 18 0" fill="none" stroke="#1a1a26" stroke-width="3" stroke-linecap="round"/>
    <use href="#hand" x="-46" y="-50"/>
    <use href="#hand" x="46" y="-50"/>
  </g>

  <!-- 2. Running (leans in, feet apart, hands swing) -->
  <g transform="translate(300 262)">
    <use href="#foot" x="-26" y="-4" transform="rotate(-12 -26 -4)"/>
    <use href="#foot" x="16" y="0"/>
    <g transform="rotate(7 0 -44)">
      <rect x="-30" y="-74" width="60" height="60" rx="8" fill="url(#body)" stroke="#1a1a26" stroke-width="3"/>
      <ellipse cx="-6" cy="-52" rx="5" ry="7" fill="#1a1a26"/>
      <ellipse cx="16" cy="-52" rx="5" ry="7" fill="#1a1a26"/>
      <circle cx="-4.5" cy="-55" r="1.6" fill="#fff"/>
      <circle cx="17.5" cy="-55" r="1.6" fill="#fff"/>
      <path d="M-2 -34 q9 8 18 0" fill="none" stroke="#1a1a26" stroke-width="3" stroke-linecap="round"/>
    </g>
    <use href="#hand" x="-44" y="-36"/>
    <use href="#hand" x="50" y="-60"/>
    <!-- dust -->
    <rect x="-56" y="-10" width="7" height="7" fill="#b4b4c6" opacity="0.6" transform="rotate(30 -52 -6)"/>
    <rect x="-72" y="-18" width="5" height="5" fill="#b4b4c6" opacity="0.4" transform="rotate(10 -70 -16)"/>
  </g>

  <!-- 3. Dash (stretched, blue, determined, fists forward) -->
  <g transform="translate(510 222)">
    <rect x="-118" y="-22" width="60" height="38" rx="8" fill="#8fd3ff" opacity="0.18"/>
    <rect x="-84" y="-24" width="62" height="42" rx="8" fill="#8fd3ff" opacity="0.32"/>
    <rect x="-40" y="-26" width="84" height="46" rx="9" fill="url(#bodyDash)" stroke="#1a1a26" stroke-width="3"/>
    <!-- determined squint -->
    <path d="M8 -14 l12 4" stroke="#1a1a26" stroke-width="3" stroke-linecap="round"/>
    <path d="M26 -14 l-2 6" stroke="#1a1a26" stroke-width="0" />
    <ellipse cx="14" cy="-5" rx="4.5" ry="4" fill="#1a1a26"/>
    <ellipse cx="32" cy="-5" rx="4.5" ry="4" fill="#1a1a26"/>
    <path d="M26 -12 l12 -3" stroke="#1a1a26" stroke-width="3" stroke-linecap="round"/>
    <path d="M18 9 h14" stroke="#1a1a26" stroke-width="3" stroke-linecap="round"/>
    <use href="#hand" x="60" y="-12"/>
    <use href="#hand" x="56" y="10"/>
    <use href="#foot" x="-46" y="26" transform="rotate(-70 -46 26)"/>
    <use href="#foot" x="-30" y="28" transform="rotate(-70 -30 28)"/>
  </g>

  <!-- 4. Hurt (squashed, wince, hands thrown up) -->
  <g transform="translate(700 262)">
    <use href="#foot" x="-22" y="0" transform="rotate(14 -22 0)"/>
    <use href="#foot" x="16" y="0" transform="rotate(-10 16 0)"/>
    <rect x="-36" y="-58" width="72" height="46" rx="8" fill="url(#body)" stroke="#1a1a26" stroke-width="3"/>
    <rect x="-36" y="-58" width="72" height="46" rx="8" fill="#ff5a5a" opacity="0.28"/>
    <!-- >< eyes -->
    <path d="M-18 -46 l9 5 l-9 5" fill="none" stroke="#1a1a26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 -46 l-9 5 l9 5" fill="none" stroke="#1a1a26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-7 -24 q7 -6 14 0" fill="none" stroke="#1a1a26" stroke-width="3" stroke-linecap="round"/>
    <use href="#hand" x="-52" y="-74"/>
    <use href="#hand" x="50" y="-80"/>
    <rect x="-70" y="-50" width="7" height="7" fill="#ff5a5a" opacity="0.8" transform="rotate(20 -66 -46)"/>
    <rect x="62" y="-40" width="6" height="6" fill="#ff5a5a" opacity="0.7" transform="rotate(40 65 -37)"/>
  </g>

  <!-- 5. Stomp (landing on a melee enemy, delighted, arms up) -->
  <g transform="translate(890 262)">
    <!-- the flattened melee enemy -->
    <ellipse cx="0" cy="-10" rx="38" ry="12" fill="#ff8a2a" stroke="#1a1a26" stroke-width="3"/>
    <ellipse cx="-12" cy="-12" rx="6" ry="3" fill="#fff"/>
    <ellipse cx="-11" cy="-12" rx="2.5" ry="2" fill="#1a1020"/>
    <!-- stars -->
    <path d="M30 -34 l2 5 5 1 -4 3 1 5 -4 -3 -4 3 1 -5 -4 -3 5 -1z" fill="#ffe28a"/>
    <!-- the player, mid-bounce -->
    <g transform="translate(0 -40)">
      <use href="#foot" x="-14" y="-8"/>
      <use href="#foot" x="10" y="-8"/>
      <rect x="-28" y="-80" width="56" height="64" rx="8" fill="url(#body)" stroke="#1a1a26" stroke-width="3"/>
      <ellipse cx="-10" cy="-58" rx="5" ry="8" fill="#1a1a26"/>
      <ellipse cx="10" cy="-58" rx="5" ry="8" fill="#1a1a26"/>
      <circle cx="-8.5" cy="-61" r="1.8" fill="#fff"/>
      <circle cx="11.5" cy="-61" r="1.8" fill="#fff"/>
      <path d="M-11 -38 q11 14 22 0 z" fill="#1a1a26"/>
      <use href="#hand" x="-40" y="-92"/>
      <use href="#hand" x="40" y="-92"/>
    </g>
    <ellipse cx="0" cy="-22" rx="52" ry="9" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.7"/>
  </g>

  <g fill="#9a9aae" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1.5">
    <text x="110" y="300">IDLE</text>
    <text x="300" y="300">RUNNING</text>
    <text x="510" y="300">DASH</text>
    <text x="700" y="300">HURT</text>
    <text x="890" y="300">STOMP</text>
  </g>
  <text x="500" y="340" fill="#5c5c70" font-size="12" text-anchor="middle">Concept only: floating hands, L-shaped feet, simple face. The hitbox stays the same square.</text>
</svg>
