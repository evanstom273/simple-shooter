<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" width="1000" height="930" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#1d1d2a"/>
      <stop offset="1" stop-color="#0b0b10"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#f07a1c"/>
    </linearGradient>
    <linearGradient id="orangeHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e8"/>
      <stop offset="1" stop-color="#ffc58a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff59a"/>
      <stop offset="1" stop-color="#3fc957"/>
    </linearGradient>
    <linearGradient id="greenHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fff0"/>
      <stop offset="1" stop-color="#b9f7b8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a6c"/>
      <stop offset="1" stop-color="#c8342b"/>
    </linearGradient>
    <linearGradient id="redHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2ea"/>
      <stop offset="1" stop-color="#ffab96"/>
    </linearGradient>
    <g id="star"><path d="M0 -7 l2 5 5 1 -4 3 1 5 -4 -3 -4 3 1 -5 -4 -3 5 -1z" fill="#ffe28a"/></g>
  </defs>
  <rect width="1000" height="930" fill="url(#bg)"/>

  <!-- ============ MELEE ============ -->
  <g transform="translate(0 0)">
    <text x="24" y="38" fill="#ff9a40" font-size="18" font-weight="800" letter-spacing="2">MELEE</text>
    <text x="110" y="38" fill="#7a7a90" font-size="13">orange ball · one big eye · little floating hands · hops, rolls, leaps</text>
    <rect x="0" y="230" width="1000" height="6" fill="#2b2b3a"/>

    <!-- hop: stretched, mid-air, hands up -->
    <g transform="translate(110 168)">
      <ellipse cx="0" cy="60" rx="20" ry="5" fill="#000" opacity="0.35"/>
      <ellipse cx="0" cy="0" rx="25" ry="31" fill="url(#orange)" stroke="#1a1a26" stroke-width="3"/>
      <ellipse cx="5" cy="-6" rx="11" ry="12" fill="#fff" stroke="#1a1a26" stroke-width="2"/>
      <circle cx="9" cy="-5" r="5" fill="#1a1020"/><circle cx="10.5" cy="-7" r="1.6" fill="#fff"/>
      <circle cx="-34" cy="-18" r="7" fill="url(#orange)" stroke="#1a1a26" stroke-width="2.5"/>
      <circle cx="34" cy="-22" r="7" fill="url(#orange)" stroke="#1a1a26" stroke-width="2.5"/>
    </g>

    <!-- wind-up: heating white, eye narrowed, hands pulled back, shiver -->
    <g transform="translate(300 202)">
      <ellipse cx="0" cy="0" rx="34" ry="24" fill="url(#orangeHot)" stroke="#1a1a26" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="44" ry="34" fill="none" stroke="#fff3d6" stroke-width="2" opacity="0.5"/>
      <path d="M-6 -12 h18 a0 0 0 0 1 0 0 v6 a9 7 0 0 1 -18 0 z" fill="#fff" stroke="#1a1a26" stroke-width="2"/>
      <circle cx="6" cy="-6" r="4.5" fill="#1a1020"/>
      <path d="M-8 -15 l22 4" stroke="#1a1a26" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="-46" cy="6" r="7" fill="url(#orangeHot)" stroke="#1a1a26" stroke-width="2.5"/>
      <circle cx="-38" cy="-16" r="7" fill="url(#orangeHot)" stroke="#1a1a26" stroke-width="2.5"/>
      <path d="M38 -14 l8 -4 M40 0 l9 0 M38 14 l8 4" stroke="#fff3d6" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- roll: eye spun round, motion lines, hands tucked -->
    <g transform="translate(500 202)">
      <path d="M-90 -14 h40 M-100 0 h48 M-88 14 h36" stroke="#ff9a40" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
      <circle cx="0" cy="0" r="28" fill="url(#orange)" stroke="#1a1a26" stroke-width="3"/>
      <path d="M-20 -8 a22 22 0 0 1 18 -14" fill="none" stroke="#fff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
      <g transform="rotate(130)"><ellipse cx="12" cy="0" rx="9" ry="10" fill="#fff" stroke="#1a1a26" stroke-width="2"/><circle cx="15" cy="0" r="4" fill="#1a1020"/></g>
      <circle cx="0" cy="0" r="4" fill="#1a1a26" opacity="0.15"/>
    </g>

    <!-- dizzy: spiral eye, stars, hands drooping -->
    <g transform="translate(700 202)">
      <circle cx="0" cy="0" r="28" fill="url(#orange)" stroke="#1a1a26" stroke-width="3"/>
      <ellipse cx="2" cy="-4" rx="11" ry="12" fill="#fff" stroke="#1a1a26" stroke-width="2"/>
      <path d="M2 -4 m0 -1 a2 2 0 1 1 -2 2 a4 4 0 1 1 5 -4 a6 6 0 1 1 -8 6" fill="none" stroke="#1a1020" stroke-width="2" stroke-linecap="round"/>
      <path d="M-6 14 q3 -4 6 0 q3 4 6 0" fill="none" stroke="#1a1a26" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-38" cy="14" r="7" fill="url(#orange)" stroke="#1a1a26" stroke-width="2.5"/>
      <circle cx="37" cy="18" r="7" fill="url(#orange)" stroke="#1a1a26" stroke-width="2.5"/>
      <use href="#star" x="-22" y="-44"/><use href="#star" x="4" y="-50"/><use href="#star" x="28" y="-42"/>
    </g>

    <!-- flattened: pancake, eye squashed -->
    <g transform="translate(890 220)">
      <ellipse cx="0" cy="0" rx="42" ry="11" fill="url(#orange)" stroke="#1a1a26" stroke-width="3"/>
      <ellipse cx="-4" cy="-2" rx="9" ry="4" fill="#fff" stroke="#1a1a26" stroke-width="1.5"/>
      <ellipse cx="-3" cy="-2" rx="3" ry="2" fill="#1a1020"/>
      <circle cx="-52" cy="2" r="6" fill="url(#orange)" stroke="#1a1a26" stroke-width="2"/>
      <circle cx="52" cy="2" r="6" fill="url(#orange)" stroke="#1a1a26" stroke-width="2"/>
      <use href="#star" x="22" y="-24"/>
    </g>

    <g fill="#9a9aae" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">
      <text x="110" y="262">HOP</text><text x="300" y="262">WIND-UP</text><text x="500" y="262">ROLL</text><text x="700" y="262">DIZZY</text><text x="890" y="262">STOMPED</text>
    </g>
  </g>

  <!-- ============ RANGED ============ -->
  <g transform="translate(0 310)">
    <text x="24" y="38" fill="#6fe87e" font-size="18" font-weight="800" letter-spacing="2">RANGED</text>
    <text x="122" y="38" fill="#7a7a90" font-size="13">green arrowhead · one narrow eye · tiny floating fins · hovers, aims, darts</text>
    <rect x="0" y="230" width="1000" height="6" fill="#2b2b3a"/>

    <!-- hover: bobbing, fins behind, eye watching -->
    <g transform="translate(110 130)">
      <path d="M-8 44 q4 6 8 0 q4 6 8 0" fill="none" stroke="#6fe87e" stroke-width="2" opacity="0.4"/>
      <path d="M42 0 L-22 -17 L-12 0 L-22 17 Z" fill="url(#green)" stroke="#1a1a26" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="2" cy="-2" rx="8" ry="7" fill="#fff" stroke="#1a1a26" stroke-width="2"/>
      <circle cx="5" cy="-2" r="3.5" fill="#103018"/>
      <path d="M-6 -11 l16 4" stroke="#1a1a26" stroke-width="3" stroke-linecap="round"/>
      <path d="M-30 -13 l-10 -6 l2 10z" fill="url(#green)" stroke="#1a1a26" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-30 13 l-10 6 l2 -10z" fill="url(#green)" stroke="#1a1a26" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- charging: glowing, aim line tracking (faint) -->
    <g transform="translate(300 120)">
      <line x1="32" y1="27" x2="110" y2="92" stroke="#eaffd8" stroke-width="1.5" opacity="0.35"/>
      <g transform="rotate(40)">
        <circle cx="4" cy="0" r="36" fill="none" stroke="#b9f7b8" stroke-width="2" opacity="0.45"/>
        <path d="M42 0 L-22 -17 L-12 0 L-22 17 Z" fill="url(#greenHot)" stroke="#1a1a26" stroke-width="3" stroke-linejoin="round"/>
        <ellipse cx="2" cy="0" rx="8" ry="6" fill="#fff" stroke="#1a1a26" stroke-width="2"/>
        <circle cx="6" cy="0" r="3" fill="#103018"/>
        <path d="M-30 -13 l-10 -6 l2 10z" fill="url(#greenHot)" stroke="#1a1a26" stroke-width="2" stroke-linejoin="round"/>
        <path d="M-30 13 l-10 6 l2 -10z" fill="url(#greenHot)" stroke="#1a1a26" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- locked: bright blinking line, eye wide -->
    <g transform="translate(500 120)">
      <line x1="32" y1="31" x2="118" y2="114" stroke="#eaffd8" stroke-width="3" stroke-dasharray="10 6"/>
      <g transform="rotate(44)">
        <circle cx="4" cy="0" r="40" fill="none" stroke="#eaffd8" stroke-width="2.5" opacity="0.7"/><circle cx="4" cy="0" r="50" fill="none" stroke="#eaffd8" stroke-width="1.5" opacity="0.3"/>
        <path d="M44 0 L-22 -17 L-12 0 L-22 17 Z" fill="url(#greenHot)" stroke="#1a1a26" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="2" cy="0" r="8.5" fill="#fff" stroke="#1a1a26" stroke-width="2"/>
        <circle cx="5" cy="0" r="2.5" fill="#103018"/>
      </g>
      <path d="M-30 -40 l6 8 M-42 -26 l9 4 M-14 -46 l2 9" stroke="#eaffd8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- dart: streaking away, eye wide in alarm -->
    <g transform="translate(700 110)">
      <path d="M-100 20 l70 -14 M-96 34 l64 -14 M-86 6 l52 -10" stroke="#6fe87e" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
      <g transform="rotate(-12)">
        <path d="M42 0 L-22 -17 L-12 0 L-22 17 Z" fill="url(#green)" stroke="#1a1a26" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="2" cy="-1" r="8" fill="#fff" stroke="#1a1a26" stroke-width="2"/>
        <circle cx="-1" cy="-1" r="2.5" fill="#103018"/>
        <path d="M-30 -13 l-12 -8 l2 12z" fill="url(#green)" stroke="#1a1a26" stroke-width="2" stroke-linejoin="round"/>
        <path d="M-30 13 l-12 8 l2 -12z" fill="url(#green)" stroke="#1a1a26" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <text x="26" y="-30" fill="#eaffd8" font-size="22" font-weight="900">!</text>
    </g>

    <!-- stomped: squashed flat in the air, drifting -->
    <g transform="translate(890 150)">
      <path d="M44 0 L-30 -8 L-20 0 L-30 8 Z" fill="url(#green)" stroke="#1a1a26" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-2 -3 l8 0" stroke="#1a1a26" stroke-width="3" stroke-linecap="round"/>
      <use href="#star" x="12" y="-26"/><use href="#star" x="-14" y="-22"/>
      <path d="M-4 22 q4 6 8 0" fill="none" stroke="#6fe87e" stroke-width="2" opacity="0.4"/>
    </g>

    <g fill="#9a9aae" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">
      <text x="110" y="262">HOVER</text><text x="300" y="262">CHARGING</text><text x="500" y="262">LOCKED</text><text x="700" y="262">DART</text><text x="890" y="262">STOMPED</text>
    </g>
  </g>

  <!-- ============ TANK ============ -->
  <g transform="translate(0 620)">
    <text x="24" y="38" fill="#ff6a5c" font-size="18" font-weight="800" letter-spacing="2">TANK</text>
    <text x="96" y="38" fill="#7a7a90" font-size="13">red pentagon · one heavy-browed eye · big floating fists · block feet · walks, slams</text>
    <rect x="0" y="240" width="1000" height="6" fill="#2b2b3a"/>

    <!-- walk -->
    <g transform="translate(110 240)">
      <rect x="-30" y="-14" width="24" height="14" rx="3" fill="#3a2020" stroke="#1a1a26" stroke-width="2.5"/>
      <rect x="8" y="-16" width="24" height="14" rx="3" fill="#3a2020" stroke="#1a1a26" stroke-width="2.5" transform="rotate(-8 20 -9)"/>
      <path d="M0 -130 L50 -94 L32 -16 L-32 -16 L-50 -94 Z" fill="url(#red)" stroke="#1a1a26" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="4" cy="-74" rx="15" ry="13" fill="#fff" stroke="#1a1a26" stroke-width="2.5"/>
      <circle cx="10" cy="-72" r="6" fill="#200a0a"/>
      <path d="M-14 -92 l34 8" stroke="#1a1a26" stroke-width="5" stroke-linecap="round"/>
      <rect x="-82" y="-74" width="26" height="24" rx="7" fill="url(#red)" stroke="#1a1a26" stroke-width="3"/>
      <rect x="58" y="-66" width="26" height="24" rx="7" fill="url(#red)" stroke="#1a1a26" stroke-width="3"/>
    </g>

    <!-- wind-up: crouched, fists raised high, glowing, landing marker -->
    <g transform="translate(320 240)">
      <ellipse cx="0" cy="-2" rx="70" ry="9" fill="none" stroke="#e0453a" stroke-width="3" opacity="0.9"/>
      <rect x="-32" y="-14" width="24" height="14" rx="3" fill="#3a2020" stroke="#1a1a26" stroke-width="2.5"/>
      <rect x="8" y="-14" width="24" height="14" rx="3" fill="#3a2020" stroke="#1a1a26" stroke-width="2.5"/>
      <path d="M0 -104 L58 -76 L38 -16 L-38 -16 L-58 -76 Z" fill="url(#redHot)" stroke="#1a1a26" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="4" cy="-58" rx="15" ry="9" fill="#fff" stroke="#1a1a26" stroke-width="2.5"/>
      <circle cx="9" cy="-57" r="5" fill="#200a0a"/>
      <path d="M-16 -76 l38 10" stroke="#1a1a26" stroke-width="5.5" stroke-linecap="round"/>
      <rect x="-70" y="-160" width="28" height="26" rx="7" fill="url(#redHot)" stroke="#1a1a26" stroke-width="3"/>
      <rect x="44" y="-166" width="28" height="26" rx="7" fill="url(#redHot)" stroke="#1a1a26" stroke-width="3"/>
      <path d="M-86 -130 l-8 -6 M90 -136 l8 -6 M0 -124 v-10" stroke="#ffd1c4" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- slam: fists down, shockwaves both ways -->
    <g transform="translate(540 240)">
      <path d="M-128 0 l14 -40 l22 40 z" fill="url(#red)" stroke="#1a1a26" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
      <path d="M128 0 l-14 -40 l-22 40 z" fill="url(#red)" stroke="#1a1a26" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
      <path d="M0 -84 L60 -60 L40 -6 L-40 -6 L-60 -60 Z" fill="url(#red)" stroke="#1a1a26" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M-14 -50 l10 6 l-10 6" fill="none" stroke="#1a1a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 -50 l-10 6 l10 6" fill="none" stroke="#1a1a26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-84" y="-28" width="30" height="26" rx="7" fill="url(#red)" stroke="#1a1a26" stroke-width="3"/>
      <rect x="56" y="-28" width="30" height="26" rx="7" fill="url(#red)" stroke="#1a1a26" stroke-width="3"/>
      <rect x="-104" y="-12" width="8" height="8" fill="#ff7a6c" transform="rotate(30 -100 -8)"/>
      <rect x="98" y="-18" width="7" height="7" fill="#ff7a6c" transform="rotate(15 101 -15)"/>
      <ellipse cx="0" cy="-2" rx="96" ry="10" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.6"/>
    </g>

    <!-- recovery: squashed, pulling itself up, wobbly eye, fists on the ground -->
    <g transform="translate(760 240)">
      <rect x="-34" y="-12" width="24" height="12" rx="3" fill="#3a2020" stroke="#1a1a26" stroke-width="2.5"/>
      <rect x="10" y="-12" width="24" height="12" rx="3" fill="#3a2020" stroke="#1a1a26" stroke-width="2.5"/>
      <path d="M0 -76 L62 -54 L40 -10 L-40 -10 L-62 -54 Z" fill="url(#red)" stroke="#1a1a26" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="2" cy="-44" rx="14" ry="11" fill="#fff" stroke="#1a1a26" stroke-width="2.5"/>
      <path d="M2 -44 m0 -1 a2 2 0 1 1 -2 2 a4 4 0 1 1 5 -4 a6 6 0 1 1 -8 6" fill="none" stroke="#200a0a" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M-10 -24 q5 4 10 0 q5 -4 10 0" fill="none" stroke="#1a1a26" stroke-width="3" stroke-linecap="round"/>
      <rect x="-86" y="-24" width="26" height="24" rx="7" fill="url(#red)" stroke="#1a1a26" stroke-width="3"/>
      <rect x="60" y="-24" width="26" height="24" rx="7" fill="url(#red)" stroke="#1a1a26" stroke-width="3"/>
      <text x="44" y="-80" fill="#9a9aae" font-size="16" font-weight="800" opacity="0.8">huff</text>
    </g>

    <!-- stomped: flattened under a stomp, eye squeezed shut -->
    <g transform="translate(920 240)">
      <rect x="-32" y="-10" width="22" height="10" rx="3" fill="#3a2020" stroke="#1a1a26" stroke-width="2.5"/>
      <rect x="10" y="-10" width="22" height="10" rx="3" fill="#3a2020" stroke="#1a1a26" stroke-width="2.5"/>
      <path d="M0 -56 L64 -42 L44 -8 L-44 -8 L-64 -42 Z" fill="url(#red)" stroke="#1a1a26" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M-10 -32 q10 6 20 0" fill="none" stroke="#1a1a26" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="-80" y="-34" width="22" height="20" rx="6" fill="url(#red)" stroke="#1a1a26" stroke-width="3"/>
      <rect x="58" y="-34" width="22" height="20" rx="6" fill="url(#red)" stroke="#1a1a26" stroke-width="3"/>
      <use href="#star" x="-14" y="-72"/><use href="#star" x="16" y="-78"/>
    </g>

    <g fill="#9a9aae" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">
      <text x="110" y="276">WALK</text><text x="320" y="276">WIND-UP</text><text x="540" y="276">SLAM</text><text x="760" y="276">RECOVERY</text><text x="920" y="276">STOMPED</text>
    </g>
  </g>
</svg>
